<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Signal Atlas collection and navigation</title><desc id="d">Public records and data are preserved, classified, connected with explicit keys, then searched, taught, and reused with gaps visible.</desc><rect width="1200" height="600" rx="24" fill="#071523"/><text x="50" y="58" fill="#63ddd1" font-size="30" font-family="Arial">SIGNAL ATLAS / COLLECT → TRACE → REUSE</text><g fill="#10283b" stroke="#59d5cf" stroke-width="3"><rect x="50" y="130" width="230" height="135" rx="18"/><rect x="340" y="130" width="230" height="135" rx="18"/><rect x="630" y="130" width="230" height="135" rx="18"/><rect x="920" y="130" width="230" height="135" rx="18"/><rect x="210" y="370" width="300" height="140" rx="18"/><rect x="680" y="370" width="340" height="140" rx="18"/></g><g fill="#edf3f1" font-size="23" font-family="Arial" font-weight="bold"><text x="80" y="180">Collect</text><text x="370" y="180">Preserve</text><text x="660" y="180">Classify</text><text x="950" y="180">Connect</text><text x="240" y="420">Navigate and teach</text><text x="710" y="420">Reuse with context</text></g><g fill="#a8bec5" font-size="17" font-family="Arial"><text x="80" y="218">Public records + data</text><text x="370" y="218">Original bytes + UTC</text><text x="660" y="218">Observed / derived</text><text x="950" y="218">Explicit keys only</text><text x="240" y="458">Offline search + lessons</text><text x="710" y="458">Packets + open gaps</text><text x="150" y="560">Every item keeps origin, time window, type, method, and limitation.</text></g><g stroke="#e4b577" stroke-width="4" fill="none"><path d="M280 198h55"/><path d="M570 198h55"/><path d="M860 198h55"/><path d="M1030 265c0 60-180 50-180 100"/><path d="M680 440H520"/></g></svg>
