<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title>Source → claim → experiment</title><desc>Scientific knowledge review loop with sources, assumptions, hypotheses, reproducible experiments, and an editorial admission or rejection step.</desc><rect width="1000" height="560" fill="#071322"/><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#244456" stroke-opacity=".35"/></pattern></defs><rect width="1000" height="560" fill="url(#grid)"/><text x="48" y="62" fill="#48D8CB" font-size="17" font-family="Arial" letter-spacing="3">SIGNAL ATLAS / SCIENCE</text><text x="48" y="108" fill="#F1F5F6" font-family="Arial" font-size="32" font-weight="bold">Source → claim → experiment</text><rect x="48" y="191" width="152" height="172" rx="15" fill="#11283C" stroke="#36546D" stroke-width="1.5"/><text x="124" y="247" fill="#48D8CB" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">01</text><text x="124" y="283" fill="#F1F5F6" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">SOURCES</text><text x="124" y="307" fill="#A6BECA" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle">Original documents</text><path d="M200 270H233m-9-6l9 6-9 6" stroke="#F7A963" stroke-width="3" fill="none"/><rect x="237" y="191" width="152" height="172" rx="15" fill="#11283C" stroke="#36546D" stroke-width="1.5"/><text x="313" y="247" fill="#48D8CB" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">02</text><text x="313" y="283" fill="#F1F5F6" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">ASSUMPTIONS</text><text x="313" y="307" fill="#A6BECA" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle">Units and models</text><path d="M389 270H422m-9-6l9 6-9 6" stroke="#F7A963" stroke-width="3" fill="none"/><rect x="427" y="191" width="152" height="172" rx="15" fill="#11283C" stroke="#36546D" stroke-width="1.5"/><text x="503" y="247" fill="#48D8CB" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">03</text><text x="503" y="283" fill="#F1F5F6" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">HYPOTHESIS</text><text x="503" y="307" fill="#A6BECA" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle">Falsifiable claim</text><path d="M579 270H612m-9-6l9 6-9 6" stroke="#F7A963" stroke-width="3" fill="none"/><rect x="619" y="191" width="152" height="172" rx="15" fill="#11283C" stroke="#36546D" stroke-width="1.5"/><text x="695" y="247" fill="#48D8CB" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">04</text><text x="695" y="283" fill="#F1F5F6" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">EXPERIMENT</text><text x="695" y="307" fill="#A6BECA" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle">Reproduce and control</text><path d="M771 270H804m-9-6l9 6-9 6" stroke="#F7A963" stroke-width="3" fill="none"/><rect x="810" y="191" width="152" height="172" rx="15" fill="#11283C" stroke="#36546D" stroke-width="1.5"/><text x="886" y="247" fill="#48D8CB" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle">05</text><text x="886" y="283" fill="#F1F5F6" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle">REVIEW</text><text x="886" y="307" fill="#A6BECA" font-family="Arial" font-size="12" font-weight="normal" text-anchor="middle">Admit or reject</text><path d="M883 366V422H115V366" stroke="#C2A8FF" stroke-width="2" stroke-dasharray="8 7" fill="none"/><path d="M107 377l8-11 8 11" stroke="#C2A8FF" fill="none" stroke-width="2"/><text x="504" y="454" fill="#C2A8FF" font-family="Arial" font-size="14" font-weight="normal" text-anchor="middle">ITERATE: NEGATIVE RESULTS INFORM THE NEXT RESEARCH CYCLE</text><text x="48" y="529" fill="#A6BECA" font-family="Arial" font-size="13">ORIGINAL EDUCATIONAL MODEL • VERSION 0.3 • SYNTHETIC / MATHEMATICAL</text></svg>