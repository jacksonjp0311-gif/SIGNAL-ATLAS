<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img"><title>Comparing documentary evidence for international military intelligence research</title><desc>Three boxes differentiate agency self-description, independent oversight and civilian or general defense reporting.</desc><rect width="1400" height="720" fill="#081827"/><rect x="28" y="28" width="1344" height="664" rx="16" stroke="#38576d" fill="#0d2636"/><text x="70" y="106" fill="#eff8f5" font-size="49" font-family="Arial" font-weight="bold">WORLDWIDE MILITARY RESEARCH: EVIDENCE CLASSES</text><text x="70" y="151" fill="#8abfc8" font-size="22" font-family="Arial">Public information is not a uniform measure of national technical capability</text><rect x="66" y="228" width="411" height="334" rx="14" fill="#183f47" stroke="#48e6dc" stroke-width="3"/><text x="88" y="288" fill="#f7f7ef" font-size="31" font-family="Arial" font-weight="bold">SELF-REPORT</text><text x="88" y="342" fill="#9fd2db" font-size="22" font-family="Arial">Finland / Japan</text><text x="88" y="434" fill="#e2e9e3" font-size="19" font-family="Arial">What an institution publicly says</text><text x="88" y="487" fill="#ffbd82" font-size="20" font-family="Arial">EVIDENCE ≠ CAPABILITY</text><rect x="508" y="228" width="411" height="334" rx="14" fill="#243e55" stroke="#8db9d8" stroke-width="3"/><text x="530" y="288" fill="#f7f7ef" font-size="31" font-family="Arial" font-weight="bold">OVERSIGHT</text><text x="530" y="342" fill="#9fd2db" font-size="22" font-family="Arial">New Zealand</text><text x="530" y="434" fill="#e2e9e3" font-size="19" font-family="Arial">Independent scrutiny and limits</text><text x="530" y="487" fill="#ffbd82" font-size="20" font-family="Arial">EVIDENCE ≠ CAPABILITY</text><rect x="950" y="228" width="411" height="334" rx="14" fill="#423326" stroke="#f2ae77" stroke-width="3"/><text x="972" y="288" fill="#f7f7ef" font-size="31" font-family="Arial" font-weight="bold">CONTEXT</text><text x="972" y="342" fill="#9fd2db" font-size="22" font-family="Arial">Brazil / South Africa</text><text x="972" y="434" fill="#e2e9e3" font-size="19" font-family="Arial">Civilian or defense records, not SIGINT proof</text><text x="972" y="487" fill="#ffbd82" font-size="20" font-family="Arial">EVIDENCE ≠ CAPABILITY</text><text x="74" y="627" fill="#a3c6d0" font-size="21" font-family="Arial">Never infer an active collection method from the existence of an intelligence agency.</text></svg>