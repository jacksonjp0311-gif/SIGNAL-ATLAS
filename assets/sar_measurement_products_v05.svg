<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img"><title>SAR SLC and GRD information retention</title><desc>Two labeled conceptual signal representations compare complex samples retaining phase and amplitude against detected GRD amplitude products; detection loses phase.</desc><rect width="1400" height="720" fill="#081827"/><rect x="28" y="28" width="1344" height="664" rx="16" stroke="#38576d" fill="#0d2636"/><text x="70" y="106" fill="#eff8f5" font-size="49" font-family="Arial" font-weight="bold">SAR DATA: WHAT CHANGES AFTER DETECTION?</text><text x="70" y="151" fill="#8abfc8" font-size="22" font-family="Arial">Same radar scene • different retained measurement information</text><rect x="65" y="202" width="604" height="346" rx="15" fill="#417aa0" fill-opacity=".2" stroke="#417aa0" stroke-width="3"/><text x="93" y="253" fill="#ffffff" font-size="38" font-family="Arial" font-weight="bold">SLC</text><text x="93" y="289" fill="#d2e4ea" font-size="24" font-family="Arial">Complex-valued samples</text><rect x="730" y="202" width="604" height="346" rx="15" fill="#a16b45" fill-opacity=".2" stroke="#a16b45" stroke-width="3"/><text x="758" y="253" fill="#ffffff" font-size="38" font-family="Arial" font-weight="bold">GRD</text><text x="758" y="289" fill="#d2e4ea" font-size="24" font-family="Arial">Detected amplitude product</text><g stroke="#86e5e1" stroke-width="3" fill="none"><circle cx="354" cy="412" r="80"/><path d="M354 412L420 359"/><path d="M270 412H440M354 327V496"/></g><text x="295" y="520" font-size="20" fill="#d2e4ea">amplitude + phase</text>
