<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Frequency stability measurement and reporting chain</title><desc id="desc">A measurement chain from a frequency reference and device under test through phase or frequency samples, averaging intervals, stability statistics, and a report that states uncertainty and conditions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#61d3c8"/></marker></defs><rect width="1200" height="650" fill="#071827"/><text x="56" y="70" fill="#f2f6f8" font-family="Arial" font-size="30" font-weight="700">Measure stability with its interval and uncertainty</text><text x="56" y="111" fill="#a9c1cd" font-family="Arial" font-size="18">A stability statistic describes variation under a stated method; it does not by itself establish accuracy.</text><g font-family="Arial" text-anchor="middle"><g fill="#102d3e" stroke="#397286" stroke-width="2"><rect x="54" y="200" width="205" height="145" rx="15"/><rect x="300" y="200" width="205" height="145" rx="15"/><rect x="546" y="200" width="205" height="145" rx="15"/><rect x="792" y="200" width="205" height="145" rx="15"/><rect x="1038" y="200" width="122" height="145" rx="15"/></g><g fill="#70ded2" font-size="18" font-weight="700"><text x="156" y="245">Reference</text><text x="402" y="245">Device under test</text><text x="648" y="245">Time series</text><text x="894" y="245">Averaging</text><text x="1099" y="245">Report</text></g><g fill="#d1e1e7" font-size="15"><text x="156" y="278"><tspan x="156">traceability and</tspan><tspan x="156" dy="23">reference conditions</tspan></text><text x="402" y="278"><tspan x="402">frequency, phase,</tspan><tspan x="402" dy="23">or time error</tspan></text><text x="648" y="278"><tspan x="648">sampling interval</tspan><tspan x="648" dy="23">and metadata</tspan></text><text x="894" y="278"><tspan x="894">select τ and</tspan><tspan x="894" dy="23">document estimator</tspan></text><text x="1099" y="278"><tspan x="1099">method, τ,</tspan><tspan x="1099" dy="23">uncertainty</tspan></text></g></g><g stroke="#61d3c8" stroke-width="3" marker-end="url(#arrow)"><path d="M260 273h32"/><path d="M506 273h32"/><path d="M752 273h32"/><path d="M998 273h32"/></g><rect x="86" y="430" width="1028" height="126" rx="15" fill="#102432" stroke="#875b44" stroke-width="2"/><text x="120" y="470" fill="#ffc18c" font-family="Arial" font-size="19" font-weight="700">Interpretation guardrails</text><text x="120" y="508" fill="#d5e2e7" font-family="Arial" font-size="17">State the observation, nominal value, reference, averaging time τ, estimator, environment, and uncertainty.</text><text x="120" y="538" fill="#a9c1cd" font-family="Arial" font-size="16">See NIST SP 1065 and the synthetic lab; example data are illustrative, not instrument performance.</text></svg>
