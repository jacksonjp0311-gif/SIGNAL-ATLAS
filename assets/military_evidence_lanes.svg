<svg xmlns="http://www.w3.org/2000/svg" width="880" height="488" viewBox="0 0 880 488" role="img" aria-label="Four evidence lanes for safely comparing published military signals intelligence research"><title>Four evidence lanes for safely comparing published military signals intelligence research</title><rect width="880" height="488" fill="#071726"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="49" font-size="22" fill="#6DE0D6" font-weight="700" text-anchor="start" >04 / MILITARY RESEARCH WITHOUT CAPABILITY GUESSWORK</text><text x="30" y="77" font-size="14" fill="#A6C0CB" font-weight="500" text-anchor="start" >Four distinct questions — each needs a different kind of evidence</text><rect x="32" y="102" width="816" height="68" rx="7" fill="#0B2637" stroke="#3E6472" stroke-width="1.5"/><rect x="42" y="112" width="20" height="48" rx="4" fill="#0F6973" stroke="#0F6973" stroke-width="1.5"/><text x="78" y="129" font-size="15" fill="#E9F4F1" font-weight="700" text-anchor="start" >WHAT IS IT?</text><text x="78" y="151" font-size="13" fill="#9FBCC5" font-weight="500" text-anchor="start" >Published vocabulary</text><text x="420" y="139" font-size="14" fill="#E6C09B" font-weight="500" text-anchor="start" >Agency explainers, standards</text><rect x="32" y="183" width="816" height="68" rx="7" fill="#112E3E" stroke="#3E6472" stroke-width="1.5"/><rect x="42" y="193" width="20" height="48" rx="4" fill="#A26747" stroke="#A26747" stroke-width="1.5"/><text x="78" y="210" font-size="15" fill="#E9F4F1" font-weight="700" text-anchor="start" >WHO IS RESPONSIBLE?</text><text x="78" y="232" font-size="13" fill="#9FBCC5" font-weight="500" text-anchor="start" >Mandate / structure</text><text x="420" y="220" font-size="14" fill="#E6C09B" font-weight="500" text-anchor="start" >Legislation, annual reports</text><rect x="32" y="264" width="816" height="68" rx="7" fill="#0B2637" stroke="#3E6472" stroke-width="1.5"/><rect x="42" y="274" width="20" height="48" rx="4" fill="#0F6973" stro