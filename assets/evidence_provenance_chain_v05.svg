<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img"><title>Four-stage scientific measurement provenance chain</title><desc>Measurement context flows through transformations, evidence review and citation-bearing compact packets. Source conditions and units must be retained.</desc><rect width="1400" height="720" fill="#081827"/><rect x="28" y="28" width="1344" height="664" rx="16" stroke="#38576d" fill="#0d2636"/><text x="70" y="106" fill="#eff8f5" font-size="49" font-family="Arial" font-weight="bold">PROVENANCE IS PART OF THE RESULT</text><text x="70" y="151" fill="#8abfc8" font-size="22" font-family="Arial">Measured bytes do not carry their meaning without context</text><rect x="60" y="250" width="293" height="269" rx="14" stroke="#50dfd6" stroke-width="3" fill="#0b3142"/><text x="86" y="305" font-size="24" fill="#8ed4d7" font-family="Arial">01</text><text x="86" y="368" font-size="31" font-weight="bold" fill="white" font-family="Arial">MEASUREMENT</text><text x="86" y="422" font-size="21" fill="#cadde3" font-family="Arial">units • sample rate</text><text x="86" y="461" font-size="21" fill="#cadde3" font-family="Arial">calibration • time</text><text x="369" y="395" font-size="36" fill="#eeb482">→</text><rect x="396" y="250" width="293" height="269" rx="14" stroke="#6caad2" stroke-width="3" fill="#0b3142"/><text x="422" y="305" font-size="24" fill="#8ed4d7" font-family="Arial">02</text><text x="422" y="368" font-size="31" font-weight="bold" fill="white" font-family="Arial">TRANSFORM</text><text x="422" y="422" font-size="21" fill="#cadde3" font-family="Arial">filter • detect</text><text x="422" y="461" font-size="21" fill="#cadde3" font-family="Arial">resample • map</text><text x="705" y="395" font-size="36" fill="#eeb482">→</text><rect x="732" y="250" width="293" height="269" rx="14" stroke="#e4aa70" stroke-width="3" fill="#0b3142"/><text x="758" y="305" font-size="24" fill="#8ed4d7" font-family="Arial">03</text><text x="758" y="368" font-size="31" font-weight="bold" fill="white" font-family="Arial">EVIDENCE</text><text x="758" y="422" font-size="21" fill="#cadde3" font-family="Arial">source • version</text><text x="758" y="461" font-size="21" fill="#cadde3" font-family="Arial">assumptions • scope</text><text x="1041" y="395" font-size="36" fill="#eeb482">→</text><rect x="1068" y="250" width="293" height="269" rx="14" stroke="#9bcaad" stroke-width="3" fill="#0b3142"/><text x="1094" y="305" font-size="24" fill="#8ed4d7" font-family="Arial">04</text><text x="1094" y="368" font-size="31" font-weight="bold" fill="white" font-family="Arial">PACKET</text><text x="1094" y="422" font-size="21" fill="#cadde3" font-family="Arial">citation • caveat</text><text x="1094" y="461" font-size="21" fill="#cadde3" font-family="Arial">source hash • status</text><text x="74" y="616" font-size="24" fill="#f5bd83" font-family="Arial">WARNING: preserving a small summary is not the same as preserving the experiment.</text></svg>