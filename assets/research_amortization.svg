<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="465" viewBox="0 0 1060 465" role="img">
<title>Research amortization architecture for Signal Atlas</title><desc id="desc">Research sources enter a reviewed evidence archive. The archive supplies small versioned packets to many independent agents. Unverified new findings return to a separate candidate review desk rather than directly changing approved knowledge.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#081628"/><stop offset="1" stop-color="#112a40"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#54D1C6"/></marker></defs>
<rect width="1060" height="465" rx="24" fill="url(#bg)"/><text x="38" y="52" fill="#EAF5FF" font-family="Arial" font-size="28" font-weight="bold">RESEARCH AMORTIZATION</text><text x="40" y="79" fill="#99C4CE" font-family="Arial" font-size="14">One bounded research domain · shared evidence · repeatable retrieval</text>
<rect x="38" y="120" width="250" height="122" rx="12" fill="#18344A" stroke="#6C9DAE"/><text x="57" y="150" fill="#FFF" font-family="Arial" font-size="20" font-weight="bold">PUBLIC SOURCES</text><text x="57" y="177" fill="#C2D6DC" font-family="Arial" font-size="14">Papers · public archives</text><text x="57" y="199" fill="#C2D6DC" font-family="Arial" font-size="14">Physics · standards</text><text x="57" y="221" fill="#FFBA82" font-family="Arial" font-size="13">Licenses &amp; provenance</text>
<rect x="392" y="120" width="282" height="122" rx="12" fill="#124950" stroke="#54D1C6" stroke-width="2"/><text x="410" y="150" fill="#FFF" font-family="Arial" font-size="20" font-weight="bold">REVIEWED ATLAS</text><text x="410" y="177" fill="#C4F5EE" font-family="Arial" font-size="14">Source IDs · bounded claims</text><text x="410" y="199" fill="#C4F5EE" font-family="Arial" font-size="14">Original lessons · citations</text><text x="410" y="221" fill="#FFCE91" font-family="Arial" font-size="13">Stable versioned references</text>
<rect x="780" y="120" width="241" height="122" rx="12" fill="#273957" stroke="#86B8DE"/><text x="798" y="150" fill="#FFF" font-family="Arial" font-size="20" font-weight="bold">PACKET INTERFACE</text><text x="798" y="177" fill="#D7E7FF" font-family="Arial" font-size="14">Query → small source set</text><text x="798" y="199" fill="#D7E7FF" font-family="Arial" font-size="14">Version · scope · caveats</text><text x="798" y="221" fill="#FFCE91" font-family="Arial" font-size="13">Read-only by default</text>
<path d="M288 181H392" stroke="#54D1C6" stroke-width="3" marker-end="url(#arrow)"/><path d="M674 181H780" stroke="#54D1C6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="38" y="302" width="324" height="109" rx="12" fill="#332D43" stroke="#D1A1D7"/><text x="57" y="333" fill="#FFF" font-family="Arial" font-size="19" font-weight="bold">CANDIDATE RESEARCH</text><text x="57" y="360" fill="#DDD0EE" font-family="Arial" font-size="14">New ideas · replications · gaps</text><text x="57" y="383" fill="#FFBA82" font-family="Arial" font-size="14">Separate human review required</text>
<rect x="497" y="302" width="524" height="109" rx="12" fill="#1A3650" stroke="#638FAB"/><text x="515" y="332" fill="#FFF" font-family="Arial" font-size="19" font-weight="bold">HUMAN READERS &amp; INDEPENDENT AGENTS</text><text x="515" y="359" fill="#D0E4F2" font-family="Arial" font-size="14">Retrieve cited material, learn, compare, and reproduce</text><text x="515" y="381" fill="#D0E4F2" font-family="Arial" font-size="14">New findings are submitted as candidates — not auto-published</text>
<path d="M900 242V302" stroke="#54D1C6" stroke-width="3" marker-end="url(#arrow)"/><path d="M497 356H362" stroke="#D1A1D7" stroke-dasharray="6 6" stroke-width="3" marker-end="url(#arrow)"/><path d="M194 302V270H517V242" fill="none" stroke="#FFBA82" stroke-dasharray="7 7" stroke-width="2"/><text x="274" y="260" fill="#FFBA82" font-family="Arial" font-size="13">Reviewed candidates only</text>
<text x="40" y="445" fill="#94A9BB" font-family="Arial" font-size="12">Concept illustration · does not claim measured AI compute savings</text>
</svg>
