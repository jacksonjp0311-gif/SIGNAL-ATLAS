<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" role="img" aria-label="Five-step evidence admission pipeline with rejection and publication outcomes"><title>Five-step evidence admission pipeline with rejection and publication outcomes</title><rect width="880" height="436" fill="#071726"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="49" font-size="23" fill="#69DBD3" font-weight="700" text-anchor="start" >03 / RESEARCH ADMISSION PIPELINE</text><text x="30" y="75" font-size="14" fill="#A5BFCA" font-weight="500" text-anchor="start" >From discovered URL to trusted, human-readable and agent-readable entry</text><rect x="30" y="119" width="145" height="118" rx="7" fill="#0E2E3D" stroke="#4B8392" stroke-width="1.5"/><text x="43" y="147" font-size="15" fill="#F1F7EE" font-weight="700" text-anchor="start" >01 / DISCOVER</text><text x="43" y="175" font-size="13" fill="#B1C9D0" font-weight="500" text-anchor="start" >source URL</text><text x="43" y="210" font-size="10" fill="#FFBA7F" font-weight="700" text-anchor="start" >CANDIDATE</text><line x1="175" y1="172" x2="195" y2="172" stroke="#FFB078" stroke-width="2" stroke-dasharray=""/><polygon points="192,168 198,172 192,176" fill="#FFB078"/><rect x="197" y="119" width="145" height="118" rx="7" fill="#0E2E3D" stroke="#4B8392" stroke-width="1.5"/><text x="210" y="147" font-size="15" fill="#F1F7EE" font-weight="700" text-anchor="start" >02 / CHECK</text><text x="210" y="175" font-size="13" fill="#B1C9D0" font-weight="500" text-anchor="start" >rights + date</text><text x="210" y="210" font-size="10" fill="#FFBA7F" font-weight="700" text-anchor="start" >CANDIDATE</text><line x1="342" y1="172" x2="362" y2="172" stroke="#FFB078" stroke-width="2" stroke-dasharray=""/><polygon points="359,168 365,172 359,176" fill="#FFB078"/><rect x="364" y="119" width="145" height="118" rx="7" fill="#0E2E3D" stroke="#4B8392" stroke-width="1.5"/><text x="377" y="147" font-size="15" fill="#F1F7EE" font-weight="700" text-anchor="start" >03 / READ</text><text x="377" y="175" font-size="13" fill="#B1C9D0" font-weight="500" text-anchor="start" >claims + context</text><text x="377" y="210" font-size="10" fill="#FFBA7F" font-weight="700" text-anchor="start" >REVIEW</text><line x1="509" y1="172" x2="529" y2="172" stroke="#FFB078" stroke-width="2" stroke-dasharray=""/><polygon points="526,168 532,172 526,176" fill="#FFB078"/><rect x="531" y="119" width="145" height="118" rx="7" fill="#0E2E3D" stroke="#4B8392" stroke-width="1.5"/><text x="544" y="147" font-size="15" fill="#F1F7EE" font-weight="700" text-anchor="start" >04 / COMPARE</text><text x="544" y="175" font-size="13" fill="#B1C9D0" font-weight="500" text-anchor="start" >independence</text><text x="544" y="210" font-size="10" fill="#FFBA7F" font-weight="700" text-anchor="start" >REVIEW</text><line x1="676" y1="172" x2="696" y2="172" stroke="#FFB078" stroke-width="2" stroke-dasharray=""/><polygon points="693,168 699,172 693,176" fill="#FFB078"/><rect x="698" y="119" width="145" height="118" rx="7" fill="#164D4D" stroke="#6DE2C0" stroke-width="1.5"/><text x="711" y="147" font-size="15" fill="#F1F7EE" font-weight="700" text-anchor="start" >05 / ADMIT</text><text x="711" y="175" font-size="13" fill="#B1C9D0" font-weight="500" text-anchor="start" >evidence record</text><text x="711" y="210" font-size="10" fill="#6EE6CA" font-weight="700" text-anchor="start" >ACCEPTED</text><rect x="31" y="277" width="388" height="74" rx="8" fill="#2A2527" stroke="#BB8068" stroke-width="1.5"/><text x="48" y="304" font-size="16" fill="#FFB38A" font-weight="700" text-anchor="start" >REJECT / HOLD</text><text x="48" y="327" font-size="13" fill="#D2C0B6" font-weight="500" text-anchor="start" >Broken source, unsupported claim or unclear rights</text><rect x="444" y="277" width="405" height="74" rx="8" fill="#133D42" stroke="#5FA5A5" stroke-width="1.5"/><text x="459" y="304" font-size="16" fill="#78E6D7" font-weight="700" text-anchor="start" >PUBLISH + LINK</text><text x="459" y="327" font-size="13" fill="#BCDAD7" font-weight="500" text-anchor="start" >Lessons, source IDs, agents, history, gaps</text><line x1="270" y1="237" x2="270" y2="277" stroke="#D39880" stroke-width="2" stroke-dasharray="4 3"/><line x1="765" y1="237" x2="765" y2="277" stroke="#69DBD3" stroke-width="2" stroke-dasharray=""/><text x="29" y="402" font-size="14" fill="#B6D0D1" font-weight="500" text-anchor="start" >Principle: a citation is a traceable source link, not automatic proof of truth.</text></g></svg>