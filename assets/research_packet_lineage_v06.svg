<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Evidence lineage in a Signal Atlas research packet</title><desc id="desc">An offline query is matched by explicit curator-written aliases or exact metadata terms, selects source cards, links attributed claims and candidates, records file hashes and review dates, and emits unresolved gaps when no source matches.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#61d3c8"/></marker></defs><rect width="1200" height="640" fill="#071827"/><text x="58" y="72" fill="#f2f6f8" font-family="Arial" font-size="30" font-weight="700">Small packet, visible evidence path</text><text x="58" y="110" fill="#a9c1cd" font-family="Arial" font-size="18">Deterministic metadata retrieval. No remote search, PDF reading, embeddings, or model inference.</text><g font-family="Arial" text-anchor="middle"><g fill="#102d3e" stroke="#397286" stroke-width="2"><rect x="50" y="215" width="180" height="122" rx="14"/><rect x="278" y="215" width="206" height="122" rx="14"/><rect x="532" y="215" width="190" height="122" rx="14"/><rect x="770" y="215" width="190" height="122" rx="14"/><rect x="1008" y="215" width="145" height="122" rx="14"/></g><g fill="#70ded2" font-size="18" font-weight="700"><text x="140" y="259">Question</text><text x="381" y="259">Explicit match</text><text x="627" y="259">Source cards</text><text x="865" y="259">Claims &amp; gaps</text><text x="1080" y="259">Hashes</text></g><g fill="#d1e1e7" font-size="14"><text x="140" y="290"><tspan x="140">local text</tspan><tspan x="140" dy="20">only</tspan></text><text x="381" y="290"><tspan x="381">curated phrase</tspan><tspan x="381" dy="20">or exact terms</tspan></text><text x="627" y="290"><tspan x="627">URLs, status,</tspan><tspan x="627" dy="20">scope, rights</tspan></text><text x="865" y="290"><tspan x="865">attributed, partial,</tspan><tspan x="865" dy="20">unresolved</tspan></text><text x="1080" y="290"><tspan x="1080">catalog and</tspan><tspan x="1080" dy="20">packet digests</tspan></text></g></g><g stroke="#61d3c8" stroke-width="3" marker-end="url(#arr)"><path d="M230 276h42"/><path d="M484 276h42"/><path d="M722 276h42"/><path d="M960 276h42"/></g><rect x="99" y="413" width="1002" height="133" rx="16" fill="#102432" stroke="#875b44" stroke-width="2"/><text x="134" y="455" fill="#ffc18c" font-family="Arial" font-size="20" font-weight="700">Unknown stays unknown</text><text x="134" y="493" fill="#d5e2e7" font-family="Arial" font-size="17">No match returns an unresolved reason; candidates stay excluded unless requested and remain labeled provisional.</text><text x="134" y="523" fill="#a9c1cd" font-family="Arial" font-size="16">A checksum establishes byte identity, not source truth, freshness, legal reuse, or answer quality.</text></svg>
