<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img"><title>Signal Atlas research topic graph</title><desc>Eight curated scientific and historical topics connected by descriptive, non-causal editorial edges.</desc><rect width="1400" height="720" fill="#081827"/><rect x="28" y="28" width="1344" height="664" rx="16" stroke="#38576d" fill="#0d2636"/><text x="70" y="106" fill="#eff8f5" font-size="49" font-family="Arial" font-weight="bold">TOPIC MAP: NAVIGATE IDEAS, NOT JUST FILES</text><text x="70" y="151" fill="#8abfc8" font-size="22" font-family="Arial">Click the human map to inspect sources, lessons and evidence status</text><path d="M214 256L1170 256" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M214 256L527 256" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M527 256L849 256" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M849 256L214 530" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M849 256L1170 256" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M849 256L1170 530" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M527 530L849 530" fill="none" stroke="#5e8395" stroke-width="3"/><path d="M1170 530L527 530" fill="none" stroke="#5e8395" stroke-width="3"/><rect x="70" y="203" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="214" y="263" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">RF physics</text><rect x="383" y="203" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="527" y="263" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Fourier &amp; sampling</text><rect x="705" y="203" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="849" y="263" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Measurement provenance</text><rect x="1026" y="203" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="1170" y="263" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Radar &amp; remote sensing</text><rect x="70" y="477" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="214" y="537" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Radio interferometry</text><rect x="383" y="477" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="527" y="537" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Worldwide public SIGINT history</text><rect x="705" y="477" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="849" y="537" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Oversight &amp; public institutions</text><rect x="1026" y="477" width="288" height="106" rx="16" fill="#194354" stroke="#64cbd0" stroke-width="3"/><text text-anchor="middle" x="1170" y="537" fill="#f5faff" font-family="Arial" font-size="21" font-weight="bold">Research Amortization</text><text x="78" y="650" fill="#f5b77d" font-size="21" font-family="Arial">Graph edges mean editorial topical relevance; they are NOT proof of physical causation.</text></svg>